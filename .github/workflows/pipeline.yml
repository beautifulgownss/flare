name: Flare Pipeline

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

permissions:
  contents: read
  actions: read   # needed to download the previous run's history artifact

concurrency:
  group: flare-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Runners start empty, so run history is carried between runs as an
      # artifact. Without this, every run is the "first" run and the score
      # diff has nothing to compare against.
      - name: Restore run history
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pipeline.yml
          name: run-history
          path: data/
          if_no_artifact_found: warn

      - name: Run full pipeline
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
        run: python src/run_pipeline.py

      - name: Save run history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: data/runs.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      # Only summaries are uploaded. Enriched contacts, sequences, and pitch
      # pages contain personal data and stay on the runner.
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ github.run_id }}
          path: |
            data/runs_export.json
            data/score_diff.json
            data/hubspot_sync_status.json
            data/pitch_pages_status.json
          retention-days: 14
          if-no-files-found: warn
